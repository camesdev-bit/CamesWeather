# CamesWeather - cukup file ini saja.
# Simpan sebagai .github/workflows/build.yml di repo GitHub kosong, lalu push ke main
# (atau Actions > Build APK > Run workflow). Semua file aplikasi dibuat otomatis di bawah.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Tulis aplikasi CamesWeather
        run: |
          mkdir -p www
          cat > www/index.html <<'CWEOF'
          <!doctype html>
          <html lang="id"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="color-scheme" content="dark"><meta name="theme-color" content="#0b1a3d"><title>CamesWeather</title>
          <style>
          :root{--mut:rgba(255,255,255,.72);--pn:rgba(8,16,34,.36);--ln:rgba(255,255,255,.1);box-sizing:border-box}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{margin:0;background:#0b1a3d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Roboto,system-ui,sans-serif;font-variant-numeric:tabular-nums;line-height:1.4}
          #sky,#fx,#cv,#fl{position:fixed;inset:0;pointer-events:none}#sky{z-index:0}#fx{z-index:1;overflow:hidden}#cv{z-index:2;width:100%;height:100%}#fl{z-index:2;background:#dbe8ff;opacity:0}
          .cl{position:absolute;border-radius:50%;filter:blur(9px);background:radial-gradient(closest-side,rgba(var(--cr),.95),rgba(var(--cr),.5) 60%,rgba(var(--cr),0));animation:dr 60s ease-in-out infinite alternate;transition:opacity 1.2s}
          @keyframes dr{to{transform:translateX(var(--dx,12vw))}}
          .fg{position:absolute;left:-10%;right:-10%;height:16vh;filter:blur(18px);background:rgb(var(--fc));opacity:0;transition:opacity 1.2s;animation:dr 40s ease-in-out infinite alternate}
          #sun,#moon{position:absolute;border-radius:50%;transform:translate(-50%,-50%);transition:opacity 1s}
          main{position:relative;z-index:3;max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
          header{display:flex;align-items:center;gap:10px;min-height:44px}
          .wm{font-weight:700;font-size:15px;letter-spacing:.01em;text-shadow:0 1px 8px rgba(0,0,0,.25)}.wm b{font-weight:400;opacity:.85}
          .stt{margin-left:auto;font-size:12px;padding:5px 10px;border-radius:99px;background:var(--pn);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
          #pv{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:99px}#pv:focus-visible{outline:2px solid #fff}
          .hero{will-change:opacity,transform;text-align:center;min-height:56svh;padding-top:6vh;text-shadow:0 1px 14px rgba(0,0,0,.22)}
          .city{font-size:34px;font-weight:400;letter-spacing:.2px}.tt{font-size:108px;font-weight:200;line-height:1.05;letter-spacing:-.04em;margin-top:6px}.tt i{font-style:normal;font-size:44px;vertical-align:top;position:relative;top:14px;opacity:.7;font-weight:300}
          .cn{font-size:20px;font-weight:500}.hl{font-size:20px;font-weight:500;margin-top:2px}
