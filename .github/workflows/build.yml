          var VIS={cerah:1,panas:1,angin:.95,berawan:.7,asap:.8,salju:.35,kabut:.35,hujan:0,petir:0,topan:0};
          var CV={cerah:[2,.5,0],panas:[0,0,0],angin:[4,.7,.05],berawan:[7,.88,.25],kabut:[3,.5,.1],hujan:[9,.95,.55],petir:[10,.98,.78],topan:[10,.98,.82],salju:[8,.9,.15],asap:[4,.6,.4]};
          var CL=[[-10,6,70,22],[30,3,80,26],[55,13,70,22],[3,19,75,24],[40,25,85,26],[70,31,60,20],[-5,33,70,22],[25,41,80,24],[60,47,65,20],[10,52,70,18]];
          var KT={cerah:{n:'Cerah',t:32,fl:36,hum:62,ws:8,vis:10,aq:45,w:''},panas:{n:'Panas terik',t:38,fl:44,hum:55,ws:6,vis:10,aq:70,w:'Panas ekstrem, minum yang cukup'},berawan:{n:'Berawan',t:28,fl:32,hum:80,ws:12,vis:9,aq:62,w:'Waspada hujan menjelang malam'},kabut:{n:'Berkabut',t:24,fl:25,hum:97,ws:4,vis:.8,aq:80,w:'Jarak pandang rendah, hati-hati'},hujan:{n:'Hujan',t:25,fl:28,hum:93,ws:18,vis:5,aq:30,w:'Hujan sedang, bawa payung'},petir:{n:'Hujan petir',t:25,fl:29,hum:95,ws:35,vis:3,aq:28,w:'Peringatan Merah untuk Badai Petir'},angin:{n:'Berangin',t:29,fl:30,hum:60,ws:52,vis:10,aq:40,w:'Angin kencang, waspada pohon tumbang'},topan:{n:'Topan',t:26,fl:27,hum:96,ws:105,vis:2,aq:35,w:'Peringatan topan, tetap di dalam rumah'},asap:{n:'Berasap',t:31,fl:34,hum:70,ws:7,vis:1.5,aq:185,w:'Udara berbahaya, pakai masker'},salju:{n:'Salju',t:-2,fl:-7,hum:84,ws:14,vis:2,aq:20,w:'Jalan licin, kenakan pakaian hangat'}};
          var POP={cerah:3,panas:0,berawan:22,kabut:15,hujan:78,petir:88,angin:10,topan:92,asap:0,salju:70};
