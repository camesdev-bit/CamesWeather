          <section class="pn"><div class="pl">Matahari</div><svg viewBox="0 0 300 100" width="100%" aria-hidden="true"><path d="M20 94A130 130 0 0 1 280 94" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="3" stroke-linecap="round"/><line x1="8" y1="94" x2="292" y2="94" stroke="rgba(255,255,255,.2)" stroke-dasharray="3 4"/><circle id="sd" r="8" fill="#fbbf24" stroke="#fff" stroke-width="2"/></svg><div class="sn" id="sn"></div></section>
