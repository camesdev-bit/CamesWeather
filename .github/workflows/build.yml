          <div id="ss" role="dialog" aria-label="Ganti lokasi"><h3>Ganti lokasi</h3><input id="q" type="search" placeholder="Cari kota" autocomplete="off" aria-label="Cari kota"><div id="rl"></div><button class="rs" id="gl">Lokasi saya</button> <button class="rs" id="c3">Tutup</button></div>
          <div id="sh" role="dialog" aria-label="Pratinjau kondisi"><h3>Pratinjau kondisi</h3><p>Ubah jam dan cuaca untuk melihat tampilan aplikasi.</p><label style="font-size:13px" for="hs">Jam <b id="hv"></b></label><input id="hs" type="range" min="0" max="23.75" step=".25"><div class="ch" id="ch"></div><button class="rs" id="rs">Pakai data asli</button> <button class="rs" id="cl2">Tutup</button></div>
          <script>
          var $=function(i){return document.getElementById(i)},LAT=-3.3194,LON=114.5908,CITY='Banjarmasin';try{var LS=JSON.parse(localStorage.getItem('cw:l'));if(LS){LAT=LS.a;LON=LS.o;CITY=LS.n}}catch(e){}
          function hx(c){return [1,3,5].map(function(i){return parseInt(c.substr(i,2),16)})}
