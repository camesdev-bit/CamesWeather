          function skyAt(h){for(var i=1;i<SK.length;i++)if(h<=SK[i][0]){var a=SK[i-1],b=SK[i],t=(h-a[0])/(b[0]-a[0]);return [mx(hx(a[1]),hx(b[1]),t),mx(hx(a[2]),hx(b[2]),t)]}return [hx(SK[0][1]),hx(SK[0][2])]}
