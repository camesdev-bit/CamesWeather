          .pn{margin-top:12px;padding:14px 16px;border-radius:22px;background:var(--pn);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border:1px solid var(--ln)}
          .pl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.62);padding-bottom:9px;margin-bottom:6px;border-bottom:1px solid var(--ln)}.ds{margin:0 0 10px;font-size:14px;line-height:1.35}
          .sc{overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}.sc::-webkit-scrollbar{display:none}
          .hr{display:flex;width:max-content}.hr div{width:56px;text-align:center;font-size:13px;color:var(--mut)}.hr svg{display:block;margin:4px auto 0}.hr .p{height:16px;font-size:11px;font-weight:600;color:#8ec5ff}.hr .t{color:#fff;font-weight:600}
          .dy{display:grid;grid-template-columns:72px 24px 34px 30px 1fr 30px;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--ln);font-size:15px}.dy:first-of-type{border:0}
          .dy .n{font-weight:600}.dy .n small{display:block;font-weight:400;font-size:11px;color:var(--mut)}.dy .pp{font-size:12px;font-weight:600;color:#8ec5ff}.dy .lo{text-align:right;color:var(--mut)}.dy .hi{font-weight:600}.dy.o{opacity:.5}
          .rb{position:relative;height:5px;border-radius:9px;background:rgba(255,255,255,.18)}.rb i{position:absolute;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#5eead4,#fbbf24)}
          .gd{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gd .pn{margin:0;aspect-ratio:1;display:flex;flex-direction:column}.gd .pl{border:0;padding:0;margin-bottom:8px}.gd b{display:block;font-size:34px;font-weight:400;letter-spacing:-.02em;line-height:1.1}.gd u{font-size:15px;font-weight:500;text-decoration:none;margin-left:3px}.gd small{display:block;margin-top:auto;font-size:13px;color:#fff;line-height:1.3}.uvb{height:5px;border-radius:9px;margin-top:12px;position:relative;background:linear-gradient(90deg,#34d399,#fde047,#fb923c,#ef4444,#a855f7)}.uvb i{position:absolute;top:-2px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);transform:translateX(-50%)}.rb i b{position:absolute;top:-1px;width:7px;height:7px;border-radius:50%;background:#fff;transform:translateX(-50%);box-shadow:0 0 0 1.5px rgba(0,0,0,.3)}
          .aq{display:flex;align-items:baseline;gap:10px}.aq b{font-size:42px;font-weight:300;line-height:1}
          .br{position:relative;display:flex;height:6px;border-radius:9px;overflow:hidden;margin:14px 0 4px}.br i{display:block}.mk{position:absolute;top:-3px;width:4px;height:12px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.3)}
          .pol{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;font-size:12px;color:var(--mut)}.pol b{display:block;color:#fff;font-size:18px;font-weight:500}.pb{height:4px;border-radius:9px;background:rgba(255,255,255,.18);margin-top:4px;overflow:hidden}.pb i{display:block;height:100%}
          .sn{display:flex;justify-content:space-between;font-size:20px;font-weight:300;margin-top:-6px}.sn span{display:flex;gap:6px;align-items:center}
          #sh,#ss{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));background:rgba(7,14,32,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:24px 24px 0 0;border-top:1px solid var(--ln);transform:translateY(105%);transition:transform .3s}
          #sh.on,#ss.on{transform:none}#ss h3{margin:0 0 10px;font-size:15px}#q{width:100%;height:44px;border-radius:12px;border:1px solid var(--ln);background:rgba(255,255,255,.1);color:#fff;padding:0 14px;font-size:16px}#rl{max-height:34vh;overflow:auto;margin:8px 0}#rl button{all:unset;display:block;width:100%;padding:12px 4px;border-bottom:1px solid var(--ln);font-size:15px;cursor:pointer}#rl small{display:block;color:var(--mut);font-size:12px}#rl p{font-size:13px;color:var(--mut);margin:8px 0}#mh{position:fixed;top:0;left:0;right:0;z-index:4;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px;text-align:center;font-weight:600;font-size:16px;opacity:0;pointer-events:none;background:linear-gradient(rgba(8,16,34,.5),transparent);text-shadow:0 1px 8px rgba(0,0,0,.3)}.rv .pn:not(.in){opacity:0;transform:translateY(16px)}.pn{transition:opacity .6s,transform .6s}.city{cursor:pointer}#fx{transition:transform .25s ease-out}#sh h3{margin:0 0 4px;font-size:15px}#sh p{margin:0 0 12px;font-size:12px;color:var(--mut)}
          #sh input{width:100%;height:32px;accent-color:#60a5fa}.ch{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
          .ch button,.rs{all:unset;cursor:pointer;min-height:40px;padding:0 13px;display:inline-flex;align-items:center;border-radius:99px;font-size:13px;font-weight:600;background:rgba(255,255,255,.1)}
          .ch button[aria-pressed=true]{background:#2563eb}.rs{background:rgba(255,255,255,.18)}button:focus-visible,input:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
          </style></head><body>
          <div id="sky"></div><div id="fx"></div><canvas id="cv"></canvas><div id="fl"></div>
          <div id="mh"></div>
          <main>
          <header><span class="wm">Cames<b>Weather</b></span><span class="stt" id="st" role="status"></span><button id="pv" aria-label="Pratinjau kondisi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg></button></header>
          <section class="hero"><div class="city" id="cy">Banjarmasin</div><div class="tt"><span id="tt"></span><i>°</i></div><div class="cn" id="cn"></div><div class="hl" id="hl"></div><div class="wn" id="wn"></div></section>
          <section class="pn"><p class="ds" id="ds"></p><div class="pl">Per jam</div><div class="sc"><svg id="cu" height="84" aria-hidden="true"></svg><div class="hr" id="hr"></div></div></section>
          <section class="pn"><div class="pl">Prakiraan 7 hari</div><div id="dy"></div></section>
          <section class="gd" id="gd" style="margin-top:12px"></section>
