          cat > package.json <<'CWEOF'
          {"name":"cameswather","version":"1.0.0","private":true}
          CWEOF
          cat > capacitor.config.json <<'CWEOF'
          {"appId":"my.id.cames.weather","appName":"CamesWeather","webDir":"www","server":{"androidScheme":"https"}}
          CWEOF

      - name: Pasang Capacitor dan proyek Android
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION $M || sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <application#' $M
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: CamesWeather-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
